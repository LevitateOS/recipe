name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  changes:
    uses: LevitateOS/LevitateOS/.github/workflows/detect-changes.yml@eea341c64a065d8465727919a72bc592878ea70b
    with:
      type: any

  ci:
    needs: changes
    if: needs.changes.outputs.has_changes == 'true' || github.event_name == 'workflow_dispatch'
    uses: LevitateOS/LevitateOS/.github/workflows/rust-ci.yml@eea341c64a065d8465727919a72bc592878ea70b
    with:
      msrv: '1.93'

  managed-integration:
    # These pins must identify the maintained delivery source and compiler image.
    # Missing pins fail the required job; they never silently skip acceptance.
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      RUSTUP_TOOLCHAIN: '1.99.0'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Load tracked runtime inputs
        shell: bash
        run: |
          python3 - <<'PYTHON'
          import json, os, re
          from pathlib import Path
          spec = json.loads(Path('bootstrap/managed-ci.json').read_text())
          pins = {'GINUX_REPOSITORY': spec['ginux_repository'],
                  'GINUX_SOURCE_SHA': spec['ginux_revision'],
                  'RECIPE_IMAGE_SHA256': spec['image_sha256']}
          assert re.fullmatch(r'[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+', pins['GINUX_REPOSITORY'])
          assert re.fullmatch(r'[0-9a-f]{40}', pins['GINUX_SOURCE_SHA'])
          assert re.fullmatch(r'[0-9a-f]{64}', pins['RECIPE_IMAGE_SHA256'])
          with open(os.environ['GITHUB_ENV'], 'a') as output:
              for name, value in pins.items():
                  output.write(f'{name}={value}\n')
          PYTHON
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.GINUX_REPOSITORY }}
          ref: ${{ env.GINUX_SOURCE_SHA }}
          path: .artifacts/ginux-source
          persist-credentials: false
      - name: Host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl erofs-utils rpm2cpio rpm jq ripgrep xz-utils bzip2 pkg-config libssl-dev
          rustup toolchain install 1.99.0 --profile minimal --component clippy --component rustfmt
          rustup target add --toolchain 1.99.0 x86_64-unknown-linux-gnu
      - name: Build selected launcher
        working-directory: .artifacts/ginux-source
        run: |
          test "$(git rev-parse HEAD)" = "$GINUX_SOURCE_SHA"
          make build
      - name: Produce pinned compiler image from public inputs
        run: |
          mkdir -p .artifacts/managed-ci
          cargo build --locked --release --bin recipe-image
          python3 scripts/prepare-managed-image.py \
            --ginux-source .artifacts/ginux-source \
            --producer target/release/recipe-image \
            --input-root .artifacts/managed-ci/inputs \
            --output .artifacts/managed-ci/image
      - name: Lint all integration targets
        run: cargo clippy --locked --lib --bins --test e2e --test library_backend --test image_producer -- -D warnings
      - name: Build CLI, matching worker and all integration targets
        run: |
          cargo test --locked --release --test e2e --test library_backend --test image_producer --no-run --message-format=json > .artifacts/managed-ci/build.json
      - name: Run complete standalone managed catalogs
        run: |
          sudo python3 scripts/managed-integration.py \
            --build-json .artifacts/managed-ci/build.json \
            --ginux .artifacts/ginux-source/target/x86_64-unknown-linux-gnu/release/ginux \
            --ginux-source "$GINUX_SOURCE_SHA" \
            --image .artifacts/managed-ci/image/rootfs.tar --image-sha256 "$RECIPE_IMAGE_SHA256" \
            --output .artifacts/managed-ci/results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: managed-integration-receipts
          path: |
            .artifacts/managed-ci/build.json
            .artifacts/managed-ci/image/provenance.json
            .artifacts/managed-ci/results/combination.json
            .artifacts/managed-ci/results/identity.json
            .artifacts/managed-ci/results/*catalog.txt
            .artifacts/managed-ci/results/excluded-products.json
            .artifacts/managed-ci/results/results.json
            .artifacts/managed-ci/results/integrity.json
            .artifacts/managed-ci/results/*/receipt.json
            .artifacts/managed-ci/results/*/stdout.log
            .artifacts/managed-ci/results/*/stderr.log

  standalone-resolution:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        toolchain: [stable, '1.93.0']
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}
      - name: Resolve and build independently without the release lock
        env:
          RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          set -euo pipefail
          recipe_export=$(mktemp -d "$RUNNER_TEMP/recipe-unlocked.XXXXXX")
          git archive HEAD | tar -x --exclude=Cargo.lock -C "$recipe_export"
          cd "$recipe_export"
          test ! -e Cargo.lock
          cargo build --verbose
