[package]
name = "levitate-recipe"
default-run = "recipe"
version = "0.1.4"
edition = "2024"
rust-version = "1.93"
description = "Rhai-based package recipe executor for LevitateOS"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LevitateOS/recipe"
homepage = "https://github.com/LevitateOS/recipe"
documentation = "https://docs.rs/levitate-recipe"
readme = "README.md"
keywords = ["package-manager", "recipe", "rhai", "scripting", "build"]
categories = ["command-line-utilities", "development-tools"]

[[bin]]
name = "recipe"
path = "src/bin/recipe.rs"

[[bin]]
name = "recipe-image"
path = "src/bin/recipe-image.rs"

[dependencies]
# Pinned exactly: `internals` APIs are version-sensitive. Users: `//! extends:` merging
# (AST `+=`, src/core/executor.rs), setup/hook evaluation via GlobalRuntimeState/Caches and
# the `Stmt::Var` layout (src/core/invocation.rs), and static AST walks over `Stmt`/`Expr`
# (src/core/executor.rs declared_metadata, src/inputs/discover.rs static_references,
# src/needs.rs declaration).
rhai = { version = "=1.19.0", features = ["sync", "serde", "internals"] }
anyhow = "1"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
blake3 = "1.5"
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }
hex = "0.4"
tempfile = "3"
glob = "0.3"
dirs = "5"
ureq = { version = "2", features = ["native-certs"] }
serde_json = "1"
fs2 = "0.4"
walkdir = "2"
owo-colors = "4"
indicatif = "0.17"
libc = "0.2"

# Native archive extraction (no external tools needed)
tar = "0.4"
flate2 = "1.0"
xz2 = "0.1"
bzip2 = "0.5"
zstd = "0.13"
zip = "2.2"

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/recipe", dest = "/usr/bin/recipe", mode = "0755" },
    { source = "target/release/recipe-image", dest = "/usr/bin/recipe-image", mode = "0755" },
    { source = "README.md", dest = "/usr/share/doc/levitate-recipe/README.md", mode = "0644", doc = true },
    { source = "WRITING_RECIPES.md", dest = "/usr/share/doc/levitate-recipe/WRITING_RECIPES.md", mode = "0644", doc = true },
    { source = "docs/*.md", dest = "/usr/share/doc/levitate-recipe/docs/", mode = "0644", doc = true },
    { source = "bootstrap/README.md", dest = "/usr/share/doc/levitate-recipe/bootstrap/README.md", mode = "0644", doc = true },
    { source = "bootstrap/*.json", dest = "/usr/share/doc/levitate-recipe/bootstrap/", mode = "0644", doc = true },
    { source = "examples/*.rhai", dest = "/usr/share/doc/levitate-recipe/examples/", mode = "0644", doc = true },
    { source = "docs/man/recipe.1", dest = "/usr/share/man/man1/recipe.1", mode = "0644", doc = true },
    { source = "docs/man/recipe-recipe.5", dest = "/usr/share/man/man5/recipe-recipe.5", mode = "0644", doc = true },
    { source = "docs/man/recipe-helpers.7", dest = "/usr/share/man/man7/recipe-helpers.7", mode = "0644", doc = true },
    { source = "LICENSE-MIT", dest = "/usr/share/licenses/levitate-recipe/LICENSE-MIT", mode = "0644" },
    { source = "LICENSE-APACHE", dest = "/usr/share/licenses/levitate-recipe/LICENSE-APACHE", mode = "0644" },
]

[package.metadata.generate-rpm.requires]
# rpm2archive is invoked by the image producer; ELF scanning cannot infer it.
rpm = "*"
